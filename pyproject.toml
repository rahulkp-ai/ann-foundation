[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ann-foundation"
version = "0.1.0"
description = "A foundational neural network library built from scratch — autograd engine, backpropagation, and MLP"
authors = [
    {name = "Rahul K P", email = "rahulkpkurup@gmail.com"}
]

dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "graphviz>=0.20",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "nbconvert>=7.16.0",
    "jupyter_client>=8.0.0",
    "nbformat>=5.10.0",
    "ipykernel>=6.29.0",
]

[project.urls]
Repository = "https://github.com/rahulkp-ai/ann-foundation"


[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
